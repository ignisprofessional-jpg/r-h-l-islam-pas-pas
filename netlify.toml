"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Netlify construit le site à chaque envoi sur GitHub.
# Les variables VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY sont définies dans
# Netlify (Project configuration > Environment variables), pas dans ce fichier.

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# Application monopage : toutes les adresses (/coran/1, /priere/guide…) servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et le manifeste doivent toujours être frais ; les fichiers versionnés peuvent être gardés longtemps.
[[headers]]
  for = "/sw.js"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
  Cache-Control = "no-cache"
  Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
